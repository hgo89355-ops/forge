<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: radial-gradient(120% 80% at 50% 40%, #F1F3F5 0%, #DDE1E6 70%, #CFD4DA 100%); }
    #film-canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    #film-svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
  </style>
  <div id="root" data-composition-id="film5" data-width="1080" data-height="1920" data-start="0" data-duration="24.366666666666667">
    <canvas id="film-canvas" class="clip" data-start="0" data-duration="24.366666666666667" width="1080" height="1920"></canvas>
    <svg id="film-svg" class="clip" data-start="0" data-duration="24.366666666666667" data-layout-allow-overflow viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>
  <script>
    (function () {
      const DUR = 24.366666666666667;
      const film = Film5.mount(document.getElementById('film-canvas'), document.getElementById('film-svg'));
      window.__filmRender = film.renderAt;
      const tl = gsap.timeline({ paused: true });
      const proxy = { t: 0 };
      tl.to(proxy, { t: DUR, duration: DUR, ease: 'none' }, 0);
      tl.eventCallback('onUpdate', function () { film.renderAt(tl.time()); });
      function onSeek(e) {
        const d = e && e.detail;
        if (d && typeof d.time === 'number') tl.totalTime(Math.min(d.time, tl.totalDuration()), true);
        film.renderAt(tl.time());
      }
      if (window.__film5Seek) window.removeEventListener('hf-seek', window.__film5Seek);
      window.__film5Seek = onSeek;
      window.addEventListener('hf-seek', onSeek);
      film.renderAt(0);
      window.__timelines['film5'] = tl;
    })();
  </script>
</template>
